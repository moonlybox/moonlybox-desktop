<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://moonlybox.cn; frame-src https://moonlybox.cn; connect-src 'self' https://moonlybox.cn" />
  <title>魔力宝盒</title>
  <style>
    :root {
      color-scheme: light dark;
      --titlebar-h: 40px;      /* 比常规标题栏高一点（用户需求 4） */
      --rail-w: 52px;          /* 图标栏最小宽度 */
      --list-w: 230px;         /* 第二列 */
      --bg: #f8fafc; --bg2: #ffffff; --fg: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --accent: #4f46e5; --hover: #eef2ff;
      --active-bg: #e0e7ff; --active-fg: #3730a3; /* 选中态：实色不透明（#253.46 用户：半透明视觉模糊） */
      --ok: #059669; --warn: #d97706; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --bg2: #1e293b; --fg: #e2e8f0; --muted: #94a3b8; --border: #334155; --hover: #1e293b;
        --active-bg: #3730a3; --active-fg: #ffffff; }
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); overflow: hidden; user-select: none; }

    /* ===== 标题栏（自绘，MDI 页帧切换在此；可拖拽窗口） ===== */
    #titlebar {
      height: var(--titlebar-h); display: flex; align-items: center; gap: 10px;
      padding: 0 0 0 12px; border-bottom: 1px solid var(--border); background: var(--bg2);
      -webkit-app-region: drag;
    }
    #titlebar .brand { font-size: 13px; font-weight: 700; }
    /* 页帧 tab（#253.25 用户）：active 图标/文字同色；inactive 常驻底色（页帧占位感），与 active 亮底成差 */
    #titlebar .tabs { display: flex; gap: 4px; -webkit-app-region: no-drag; }
    /* #253.27 用户：深色下原 inactive 底更亮眼——两底对调（active=亮调 mix 底，inactive=bg2 底），文字色不换 */
    #titlebar .frame-tab {
      border: 0; background: var(--bg2); color: var(--muted); font-size: 12.5px;
      padding: 5px 12px; border-radius: 7px; cursor: pointer;
      display: flex; align-items: center;
    }
    #titlebar .frame-tab:hover { color: var(--fg); }
    #titlebar .frame-tab.active {
      background: var(--bg); color: var(--fg); font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,.18);
    }
    #titlebar .spacer { flex: 1; }
    #titlebar .win-controls { display: flex; gap: 2px; -webkit-app-region: no-drag; }
    #titlebar .win-controls button {
      border: 0; background: transparent; color: var(--fg); width: 34px; height: 30px;
      font-size: 12px; cursor: pointer; border-radius: 6px;
    }
    #titlebar .win-controls button:hover { background: var(--hover); }
    #btn-upgrade { position: relative; display: flex; align-items: center; gap: 5px; padding: 0 10px; opacity: .55; }
    #btn-upgrade:hover { opacity: 1; }
    #btn-upgrade.active { opacity: 1; color: var(--warn); font-weight: 600; }
    #btn-upgrade.ready { color: var(--ok); }
    #btn-upgrade .dot {
      position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--warn); display: none;
    }
    #btn-upgrade.ready .dot { background: var(--ok); animation: pulse 1.2s infinite; }
    #upgrade-text { font-size: 12px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes cloudspin { to { transform: rotate(360deg); } }

    /* ===== 主体 3 列 ===== */
    #body { flex: 1; display: flex; min-height: 0; }
    /* 第一列：图标栏 */
    #rail {
      width: var(--rail-w); border-right: 1px solid var(--border); background: var(--bg2);
      display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px;
    }
    #rail .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
      cursor: pointer; border: 0; padding: 0; overflow: hidden; flex: none;
    }
    #rail .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    #rail .sep { width: 26px; height: 1px; background: var(--border); margin: 8px 0; }
    #rail .rail-btn {
      width: 40px; height: 40px; border: 0; background: transparent; border-radius: 9px;
      cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center;
    }
    #rail .rail-btn svg, #titlebar .win-controls svg {
      width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    #titlebar .win-controls svg { width: 14px; height: 14px; }
    #titlebar .win-controls #win-close:hover { background: #dc2626; color: #fff; }
    /* 云端列表 manifest 图标同套描边 */
    .cloud-ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    /* 选中=accent 实底白图标（窄栏强对比，参考网页端 primary 选中态的强化版） */
    #rail .rail-btn.active {
      background: var(--accent); color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,.45);
    }
    #rail .rail-btn.active svg { stroke-width: 2.2; }
    #rail .rail-btn:hover { background: var(--hover); }
    #rail .grow { flex: 1; }

    /* 第二列：功能列表 */
    #listcol {
      width: var(--list-w); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0;
    }
    #listcol .list-head { padding: 12px 14px 8px; font-size: 13px; font-weight: 700; }
    #listcol .list-body { flex: 1; overflow-y: auto; padding: 0 8px 12px; font-size: 13px; }

    /* 第三列：工作台 */
    #work { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    /* 滚动条：云端网页端同款（细圆角半透明 slate） */

    /* ===== 设置中心（#253.48：3 列化，复用主布局；不再弹窗） ===== */
    #settings-cat { padding: 6px; }
    .set-cat {
      padding: 7px 10px; margin: 1px 0; border-radius: 8px; cursor: pointer;
      font-size: 13px; line-height: 1.5; display: flex; align-items: center; gap: 8px;
      color: var(--fg); transition: background .12s; white-space: nowrap; overflow: hidden;
    }
    .set-cat:hover { background: var(--hover); }
    .set-cat.active { background: var(--active-bg); color: var(--active-fg); font-weight: 600; }
    .set-cat .sub { font-size: 11px; color: var(--muted); margin-left: auto; padding-left: 6px; }
    .set-cat.active .sub { color: var(--active-fg); opacity: .75; }
    .set-panel { padding: 24px 32px; max-width: 760px; user-select: text; }
    .set-panel h3 { font-size: 15px; margin: 0 0 4px; }
    .set-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0 0 18px; }
    .set-field { margin: 0 0 14px; }
    .set-field > label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
    .set-field input { width: 100%; }
    .set-row { display: flex; gap: 8px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
    .set-hint { font-size: 12px; line-height: 1.6; }
    .set-hint.ok { color: var(--ok); }
    .set-hint.err { color: var(--err); }
    .set-status { min-height: 18px; font-size: 12px; }
    .set-status.ok { color: var(--ok); }
    .set-status.err { color: var(--err); }


    /* ===== md 阅读视图（#253.49：排版全走主题 CSS 变量，不硬编码色值） ===== */
    .md-view { user-select: text; font-size: 14px; line-height: 1.75; }
    .md-view h1, .md-view h2, .md-view h3, .md-view h4 { margin: 1.2em 0 .5em; line-height: 1.4; }
    .md-view h1 { font-size: 1.5em; } .md-view h2 { font-size: 1.3em; } .md-view h3 { font-size: 1.15em; }
    .md-view h1:first-child, .md-view h2:first-child, .md-view h3:first-child { margin-top: .2em; }
    .md-view p { margin: .6em 0; }
    .md-view ul, .md-view ol { margin: .6em 0; padding-left: 1.6em; }
    .md-view li { margin: .25em 0; }
    .md-view blockquote { margin: .8em 0; padding: .4em 1em; border-left: 3px solid var(--border); color: var(--muted); background: var(--hover); border-radius: 0 8px 8px 0; }
    .md-view code { font: 12.5px ui-monospace, monospace; background: var(--hover); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
    .md-view pre { margin: .8em 0; padding: 12px 14px; background: var(--hover); border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
    .md-view pre code { background: transparent; border: 0; padding: 0; }
    .md-view table { border-collapse: collapse; margin: .8em 0; width: 100%; font-size: 13px; }
    .md-view th, .md-view td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .md-view th { background: var(--hover); font-weight: 600; }
    .md-view img { max-width: 100%; border-radius: 8px; }
    .md-view hr { border: 0; border-top: 1px solid var(--border); margin: 1.4em 0; }
    .md-view a { color: var(--accent); }
    .mb-mermaid { margin: 1em 0; text-align: center; }
    .mb-mermaid svg { max-width: 100%; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 9999px; background: rgba(148,163,184,.45); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.7); }

    /* 第二列拖宽手柄（#253.18：180-420px 限幅，防比例失调） */
    #col-resizer { width: 5px; cursor: col-resize; flex: none; background: transparent; transition: background .15s; }
    #col-resizer:hover, #col-resizer.dragging { background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 3px; }
    body.col-resizing { cursor: col-resize; user-select: none; }

    /* 通用 */
    .btn { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
    .btn:disabled { opacity: .5; }
    .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    input, textarea, select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; background: var(--bg2); color: var(--fg); }
    .muted { color: var(--muted); }
    .mono { font: 12px/1.6 ui-monospace, monospace; }
    /* 列表项（云端功能/书房树共用）：网页端侧栏规范（px-3 py-2.5 text-sm font-medium rounded-xl） */
    .tree-item {
      padding: 7px 10px; margin: 1px 0; border-radius: 8px; cursor: pointer;
      font-size: 13px; line-height: 1.5; display: flex; align-items: center; gap: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background .12s;
    }
    .tree-item:hover { background: var(--hover); }
    .tree-item.active {
      background: var(--active-bg); color: var(--active-fg); font-weight: 600;
    }
    .tree-item.active .cloud-ico { color: var(--active-fg); }
    #list-body { display: flex; flex-direction: column; gap: 2px; }
    .tree-item .dir { font-weight: 600; }
    .row { display: flex; gap: 8px; align-items: center; }
    /* 全局弹窗规范（用户反馈：所有弹窗需界面居中）——UA 的 dialog::backdrop modal 已固定定位
     margin:auto 居中，这里只统一外观，不抢定位 */
  dialog {
    margin: auto !important;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg2); color: var(--fg);
    padding: 0; max-width: min(560px, 92vw); /* padding 归内部容器：backdrop 点击关窗不误触 */
    box-shadow: 0 12px 48px rgba(0,0,0,.45);
    overflow: hidden;
  }
  dialog > .dlg-body { padding: 24px; }
  dialog::backdrop { background: rgba(2,6,23,.55); }
</style>
</head>
<body>
  <!-- 标题栏：MDI 页帧 + 升级灯 + 窗口控制 -->
  <div id="titlebar">
    <span class="brand">魔力宝盒</span>
    <div class="tabs" id="frame-tabs"></div>
    <span class="spacer"></span>
    <div class="win-controls">
      <button id="btn-upgrade" title="检查更新"><span id="upgrade-icon">⟳</span><span id="upgrade-text"></span><span class="dot"></span></button>
      <button id="win-min" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="win-max" title="最大化"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
      <button id="win-close" title="关闭"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>

  <div id="body">
    <!-- 第一列：图标栏（SVG 描边图标系统——与云端 manifest 图标同一套，保证风格统一） -->
    <nav id="rail">
      <button class="avatar" id="btn-avatar" title="登录/账号">?</button>
      <div class="sep"></div>
      <!-- 图标由 renderer.js navIconSvg 注入（单一源） -->
      <button class="rail-btn" data-nav="vault" title="书房（本地）"></button>
      <button class="rail-btn" data-nav="cloud" title="云端"></button>
      <button class="rail-btn" data-nav="diagram" title="图示"></button>
      <button class="rail-btn" data-nav="xiaoyue" title="小月"></button>
      <span class="grow"></span>
      <button class="rail-btn" data-nav="help" title="帮助"></button>
      <button class="rail-btn" data-nav="settings" title="设置"></button>
    </nav>

    <!-- 第二列：功能列表（内容由 JS 按 nav 填充） -->
    <section id="listcol">
      <div class="list-head" id="list-head">—</div>
      <div class="list-body" id="list-body"></div>
    </section>

    <!-- 列宽拖柄 -->
    <div id="col-resizer" title="拖动调整列宽"></div>

    <!-- 第三列：工作台（各页帧共用容器，JS 按 nav+selection 渲染） -->
    <section id="work"></section>
  </div>

  <script src="vendor/mermaid.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
