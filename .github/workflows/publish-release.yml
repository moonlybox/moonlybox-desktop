# v0.4.0 publish trigger
name: publish-release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish draft release (latest desktop-v tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG=$(git tag --list 'desktop-v*' --sort=-creatordate | head -1)
          echo "Publishing tag: $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || (echo "release not found for $TAG" && exit 1)
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
