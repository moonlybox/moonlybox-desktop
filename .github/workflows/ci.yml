name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install --no-save

      - name: Generate native bindings (typecheck 前置——gitignore 生成物，fresh clone 必缺 #251.4)
        run: bun run scripts/build.ts --gen-only

      - name: Type check
        run: bun run typecheck

      - name: Build (CLI single binary)
        run: bun run build

      # 带模型下载/平台 dylib 的 E2E 本地跑（macos runner 下载 flaky）——CI 只做编译冒烟
      - name: Smoke (CLI binary runs)
        run: ./dist/moonlybox --help | grep -q "moonlybox v"

      # 签名/公证/发布仅打 tag 时由 release 工作流处理（ secrets 隔离，见 §5.13/§5.15 ）
