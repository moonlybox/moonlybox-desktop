name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test (offline E2E)
        run: bun tests/hybrid-search.e2e.ts

      - name: Build (CLI single binary)
        run: bun run build

      # 签名/公证/发布仅打 tag 时由 release 工作流处理（ secrets 隔离，见 §5.13/§5.15 ）
