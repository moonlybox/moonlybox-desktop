<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MoonlyBox 图标 · 16px 减法版">
  <defs>
    <mask id="i16MoonMask">
      <rect width="512" height="512" fill="#ffffff"/>
      <circle cx="273" cy="184" r="40" fill="#000000"/>
    </mask>
  </defs>

  <!-- 仅三色：#2A2360 / #EAF1FF / #BFD4FF -->
  <rect width="512" height="512" rx="112" fill="#2A2360"/>
  <!-- 盒：线宽 28 -->
  <path d="M163 308 L163 368 Q163 389 184 389 L328 389 Q349 389 349 368 L349 308"
        fill="none" stroke="#BFD4FF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 0.5 圈外弧：盒口至 9 点方向 -->
  <path d="M256 270 C210 270 166 238 166 196"
        fill="none" stroke="#BFD4FF" stroke-width="28" stroke-linecap="round"/>
  <!-- 月牙放大至 r44 补偿 -->
  <circle cx="256" cy="196" r="44" fill="#EAF1FF" mask="url(#i16MoonMask)"/>
</svg>
